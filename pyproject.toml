[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-semantic-pipeline"
version = "0.1.0"
description = "Video-to-scene trajectory and semantic dataset pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "yt-dlp>=2025.1.1",
  "openai>=1.60",
  "numpy<2",
  "Pillow>=10",
  "einops>=0.8",
  "safetensors>=0.4",
  "huggingface_hub>=0.27",
  "opencv-python>=4.8",
  "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
spatial-semantic-pipeline = "spatial_semantic_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
